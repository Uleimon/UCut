name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} (Build + Tests mit ffmpeg)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: ffmpeg installieren (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ffmpeg installieren (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Kein Test darf übersprungen worden sein (ffmpeg fehlt sonst)
        shell: bash
        run: |
          if grep -q 'outcome="NotExecuted"' TestResults/*.trx; then
            echo "::error::Tests wurden übersprungen"; exit 1
          fi
